[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-workspace-governance"
version = "0.2.0a1"
description = "Governance specification and local realization toolkit for personal AI workspaces"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
pwg = "pwg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
